<!-- Header Section with Green Background -->
<app-pages-header [headerTitle]="aboutUs.title" />

<!-- Breadcrumb Navigation -->
<div class="container breadcrumb-container mt-3">
  <div class="d-flex justify-content-between align-items-center">
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb">
        <li class="breadcrumb-item">
          <a routerLink="/home" class="text-decoration-none">الصفحة الرئيسية</a>
        </li>
        <li class="breadcrumb-item active" aria-current="page">
          {{ aboutUs.title }}
        </li>
      </ol>
    </nav>
  </div>
</div>

<!-- About Us Content -->
<div class="container my-5">
  <div class="row">
    <!-- Logo Section -->
    <div class="col-lg-4 mb-4 text-center">
      <div class="logo-container mb-4">
        <img
          src="assets/images/logo2.png"
          alt="شعار سلاح الصيانة"
          class="about-logo"
        />
      </div>
    </div>

    <!-- Content Section -->
    <div class="col-lg-8">
      <!-- General Information -->
      <div class="about-section">
        <h2 class="section-heading">{{ aboutUs.generalInfo.title }}</h2>
        <p class="text-end">{{ aboutUs.generalInfo.description }}</p>
      </div>

      <!-- Historical Background -->
      <div class="about-section mt-5">
        <h2 class="section-heading">{{ aboutUs.history.title }}</h2>
        <div class="history-content">
          <p
            class="text-end"
            *ngFor="let paragraph of aboutUs.history.paragraphs"
          >
            {{ paragraph }}
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
