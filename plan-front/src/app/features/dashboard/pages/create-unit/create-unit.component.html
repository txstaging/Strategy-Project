<main class="content w-75">
  <div class="d-flex justify-content-between align-items-center m-4">
    <div>
      <h2>انشاء وحدة</h2>
      <p style="color: #5e5e5e">قم بملئ البيانات الاتية</p>
    </div>
  </div>
  <ul
    class="nav nav-underline"
    style="border-bottom: 1px solid #e8ecee; padding: 0"
  ></ul>

  <div class="form-content mt-5">
    <form  [formGroup]="createUnitForm"(ngSubmit)="CreateUnit()" >
        <div class="row mb-2">
            <div class="col-6 ">
                <div class="d-flex justify-content-between">
                  <label for="" class="form-label">الاسم</label>
                @if (createUnitForm.get('UnitName')?.invalid && createUnitForm.get('UnitName')?.touched) {
                <small class="text-danger">
                  برجاء ادخال الاسم
                </small>
                }
                </div>
                <input
                [class.is-invalid]="createUnitForm.get('UnitName')?.invalid && createUnitForm.get('UnitName')?.touched"
                type="text" class="form-control w-100" placeholder="الاسم" formControlName="UnitName">
            </div>

        </div>



        <button class="btn btn-success mt-4 px-5">تأكيد</button>
    </form>
</div>
@if (isSuccessPopupVisible) {
  <div
    class="popup-overlay"
    (click)="closeSuccessPopup()"
    tabindex="0"
    (keydown.enter)="closeSuccessPopup()"
  >
    <div
      class="container2"
      (click)="$event.stopPropagation()"
      style="padding: 5rem 2rem"
      tabindex="0"
      (keydown.enter)="$event.stopPropagation()"
    >
      <div class="text-center">
        <div class="icons mb-4">
          <span class="text-success"><i class="bi bi-check-lg"></i></span>
        </div>
        <div class="mb-4">
          <span class="status-approved">تم الأضافة بنجاح</span>
        </div>
        <div>
          <button
            (click)="closeSuccessPopup()"
            class="btn btn-primary w-25 mt-4"
          >
            تأكيد
          </button>
        </div>
      </div>
    </div>
  </div>
}

</main>
